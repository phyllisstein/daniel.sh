services:
  app:
    build:
      context: .
    environment:
      - VIRTUAL_HOST=danielsh.here
    expose:
      - '3030'
    networks:
      - default
      - nginx-proxy
    volumes:
      - type: bind
        source: .
        target: /app
        # Forces this into the API's Mounts list instead of legacy Binds, so it
        # is ordered against the node_modules volume below rather than mounted
        # after it (which would bury the volume and expose the host's tree).
        bind:
          propagation: rprivate
      - type: volume
        source: node_modules
        target: /app/node_modules
        volume:
          nocopy: true

networks:
  default:
  nginx-proxy:
    external: true
    name: nginx-proxy

volumes:
  node_modules:
